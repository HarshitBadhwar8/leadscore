name: Release

# Runs only when a version tag (v*) is pushed: never for pull requests or
# pushes to main. It tests the tagged commit, then publishes the binaries as a
# GitHub release and the image to ghcr.io. release_test.go holds these rules.
on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for only what it needs.
permissions: {}

# Two pushes of the same tag never publish at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false # a release builds from the tagged source alone
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  binaries:
    name: binaries and GitHub release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false # a release builds from the tagged source alone
      # Pure Go, so every platform cross-compiles here with cgo off. Each
      # platform ships as one archive (zip on Windows, tar.gz elsewhere) holding
      # the binary with LICENSE, NOTICE and third_party/licenses: the binary
      # compiles in third-party code whose licenses require their notices to
      # travel with it.
      - name: build and archive darwin, linux and windows for amd64 and arm64
        env:
          CGO_ENABLED: "0"
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir dist
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              name="leadscore_${TAG}_${os}_${arch}"
              ext=""
              if [ "$os" = windows ]; then ext=".exe"; fi
              mkdir -p "build/$name"
              GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags="-s -w -X github.com/HarshitBadhwar8/leadscore/internal/cli.Version=${TAG}" \
                -o "build/$name/leadscore${ext}" ./cmd/leadscore
              cp LICENSE NOTICE "build/$name/"
              mkdir -p "build/$name/third_party"
              cp -R third_party/licenses "build/$name/third_party/"
              if [ "$os" = windows ]; then
                (cd build && zip -qr "../dist/$name.zip" "$name")
              else
                tar -C build -czf "dist/$name.tar.gz" "$name"
              fi
            done
          done
          cd dist && sha256sum leadscore_* > checksums.txt
      - name: create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes

  image:
    name: image to ghcr.io (linux/amd64, linux/arm64)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io; this job only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Image names must be lowercase; the repository's owner may not be.
      # `latest` moves only for a final version: a tag with a `-` (v0.2.0-rc1)
      # is a pre-release and gets its own tag alone.
      - name: image name and tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:$TAG"
          if [[ "$TAG" != *-* ]]; then tags="$tags,$image:latest"; fi
          echo "TAGS=$tags" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No build cache: a release image is built from the tagged source alone.
      - name: push both architectures, tagged with the version (and latest)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          build-args: VERSION=${{ github.ref_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
