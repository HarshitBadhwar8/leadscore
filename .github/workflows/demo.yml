# Renders the README's demo GIF from .github/assets/demo.tape and uploads it
# as a workflow artifact. It does not commit the GIF. The tape builds
# leadscore and scores only the made-up leads in examples/leads.csv, so the
# recording uses no account and no network.
name: Demo

on:
  workflow_dispatch:
  push:
    paths:
      - .github/assets/demo.tape

permissions:
  contents: read

jobs:
  render:
    name: Render demo.gif
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          version: v0.12.1
          path: .github/assets/demo.tape
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-gif
          path: .github/assets/demo.gif
          if-no-files-found: error
