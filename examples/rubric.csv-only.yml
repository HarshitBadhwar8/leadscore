# Example rubric for a team that sends from its own tool and wants lists, not
# pushes: the same made-up company as rubric.yml (Dockyard, warehouse
# scheduling software for mid-size logistics firms in Europe), with export
# lanes only. Each run keeps one list per lane (a CSV in export.dir on SQLite,
# a tab on a Sheets store). Copy it as rubric.yml and change it to describe
# your own ideal customer. The format is in the contracts doc, section 2.
#
# It has no cold lane on purpose. A cold lane claims every lead it matches,
# even before its tool is set up, and such leads show do_not_contact: yes on
# every list. Add cold lanes only once you push to Apollo or HubSpot.
#
# Check your edits with:  leadscore rules check rubric.yml
version: 1

# Columns in your lead sheet. Any column already works as text under its
# squashed header (lowercase letters and digits: "Dock Doors" is "dockdoors");
# declare a column here to give it a type, a nicer name, or more spellings.
fields:
  warehouse_software: { type: text, aliases: ["Warehouse software", "WMS"] }
  fleet_size: { type: number, aliases: ["Fleet size", "Trucks"] }
  industry: { type: text }

# Lists the rules below refer to as $name.
settings:
  legacy_tools: [spreadsheets, excel, paper, whiteboard]
  target_industries: [freight forwarding, cold chain, food distribution]
  home_countries: [Germany, Netherlands, Austria, Switzerland]

# Facts about a company, worked out from all of its leads.
company:
  legacy_tool_seen: { any: { field: warehouse_software, in: $legacy_tools } }
  largest_fleet: { max: fleet_size }
  main_industry: { first: industry }

# Labels, worked out top to bottom. In each block the first rule that matches wins.
derive:
  fit_signal:
    level: company
    rules:
    - when: { field: company.legacy_tool_seen, eq: true }
      then: yes
    - when: { field: company.main_industry, in: $target_industries }
      then: yes
  tier:
    level: company
    rules:
    - when: { field: company.employees, missing: true }
      then: null                 # headcount unknown: no tier until you add it
    - when:
        any:
          - { field: company.employees, lt: 50 }
          - { field: company.employees, gt: 5000 }
      then: 4
    - when:
        all:
          - { field: fit_signal, eq: yes }
          - { field: company.largest_fleet, gte: 20 }
      then: 1
    - when: { field: fit_signal, eq: yes }
      then: 2
    - else: 3

# Points for ranking. The account half is about the company; the contact half about the person.
score:
  account:
    - { when: { field: tier, eq: 1 }, points: 40 }
    - { when: { field: tier, eq: 2 }, points: 25 }
    - { when: { field: tier, eq: 3 }, points: 10 }
    - { when: { field: company.region, in: $home_countries }, points: 10 }
  contact:
    - when:
        any:
          - { field: title, contains: head }
          - { field: title, contains: director }
          - { field: title, contains: vp }
      points: 15
    - { when: { field: warm_path, present: true }, points: 10 }

# The lists. A lead is added to a list once, the first run it matches; every
# run then refreshes its status and do_not_contact. Filter on do_not_contact
# before every send.
lanes:
  - id: call-list
    name: Call list
    kind: export
    priority: 2
    when: { field: tier, lte: 2 }
    push: export:call-list
  - id: nurture                  # a weaker fit, or headcount not known yet
    name: Nurture list
    kind: export
    priority: 1
    when:
      any:
        - { field: tier, eq: 3 }
        - { field: tier, missing: true }
    push: export:nurture
