# leadscore on Docker: your machine, or a server or VM (contracts section 9.2).
#
# Put this file in one folder with your leadscore.yml (start from
# examples/leadscore.laptop.yml or examples/leadscore.server.yml), your rubric
# and a .env file holding the keys:
#
#   APOLLO_API_KEY=...
#   HUBSPOT_TOKEN=...
#   LEADSCORE_RECEIVER_SECRET=...   # a long random value, e.g. `openssl rand -hex 32`
#   LEADSCORE_IMAGE=asia-south1-docker.pkg.dev/leadscore-dev/leadscore/leadscore:<commit>
#                                   # before the first release only; remove after release
#
# The receiver secret works like a password: anyone who has it can send fake
# events, including a fake positive reply that a deal lane would act on. Never
# paste it into chat, tickets or shared docs, and rotate it if it might have
# leaked (README, "Keep the receiver secret private").
#
# Then: `docker compose up -d`. Every other command runs inside the container:
# `docker compose exec leadscore leadscore status`.

services:
  leadscore:
    # Pin a released version; upgrading is changing this tag and
    # `docker compose up -d` (contracts section 9.3). Before the first release,
    # set LEADSCORE_IMAGE in .env to the private registry's image.
    image: ${LEADSCORE_IMAGE:-ghcr.io/tetriz-ai/leadscore:v0.1.0}
    # The receiver and /healthz, plus a run every `schedule` (read at start).
    command: ["serve", "--every"]
    env_file: .env
    volumes:
      # This folder: leadscore.yml, the rubric and any CSV files. Read only.
      - ./:/config:ro
      # The SQLite store, on a named volume that outlives the container.
      - leadscore-data:/data
      # The export lists (personal data): `mkdir -p out && chmod 700 out`
      # first, and on a Linux host give the folder to the container's user:
      # `sudo chown 10001:10001 out`.
      - ./out:/out
    ports:
      # The receiver listens on 8080 inside the container (leave
      # receiver.port unset). Loopback only. A tunnel on this machine points at it; on a server
      # the Caddy service below reaches the receiver over Docker's network.
      - "127.0.0.1:${LEADSCORE_PORT:-8080}:8080"
    restart: unless-stopped
    # A run stopping on SIGTERM saves within a 90-second budget; Docker's
    # default 10 seconds would cut it short.
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "leadscore", "healthz"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Optional, for a server: Caddy gets an HTTPS certificate for your domain and
  # forwards to the receiver. Point your domain's DNS at the server, open ports
  # 80 and 443, replace leads.example.com below with your domain, then
  # `docker compose --profile caddy up -d`. receiver.public_url is then
  # https://<your domain>.
  caddy:
    profiles: ["caddy"]
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    command: ["caddy", "reverse-proxy", "--from", "leads.example.com", "--to", "leadscore:8080"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    restart: unless-stopped
    depends_on: [leadscore]

volumes:
  leadscore-data:
  caddy-data:
